
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17132e">
  <title>Random Fun Zone 😂</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #17132e, #6c2bd9, #f43f8c);
      background-size: 300% 300%;
      animation: gradientMove 12s ease infinite;
    }

    .main {
      width: 100%;
      max-width: 800px;
      margin: 30px auto;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 4rem);
      overflow-wrap: anywhere;
      animation: wobble 3s ease-in-out infinite;
    }

    .emoji {
      display: inline-block;
      font-size: clamp(3rem, 12vw, 6rem);
      animation: bounce 1.5s infinite;
    }

    .message {
      margin: 24px 0;
      font-size: clamp(1.1rem, 4vw, 1.7rem);
      line-height: 1.5;
    }

    button,
    .ad-link {
      display: inline-block;
      max-width: 100%;
      margin: 8px;
      padding: 13px 20px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: #5422a8;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    button:hover,
    .ad-link:hover {
      transform: scale(1.04);
    }

    .ads {
      width: 100%;
      margin: 30px auto;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    .ads h2 {
      font-size: 1.2rem;
    }

    .ad-slot {
      width: 100%;
      max-width: 100%;
      min-height: 60px;
      margin: 16px auto;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .ad-slot iframe {
      max-width: 100%;
    }

    .ad-notice {
      font-size: 0.85rem;
      opacity: 0.8;
      line-height: 1.5;
    }

    footer {
      margin-top: 35px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    @keyframes gradientMove {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-2deg); }
      75% { transform: rotate(2deg); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .main {
        margin: 15px auto;
      }

      .ads {
        padding: 10px;
      }

      button,
      .ad-link {
        margin: 6px 2px;
        padding: 12px 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

    const emojis = [
      "🤪", "😂", "🥳", "👽", "🐸",

    const colors = [
      "linear-gradient(135deg, #17132e, #6c2bd9, #f43f8c)",

      "linear-gradient(135deg, #42275a, #734b6d)",

    ];

    const messageElement = document.getElementById("message");
    const emojiElement = document.getElementById("emoji");

    document.getElementById("funButton").addEventListener("click", () => {
      messageElement.textContent =
        messages[Math.floor(Math.random() * messages.length)];

      document.body.style.background =
        colors[Math.floor(Math.random() * colors.length)];

      emojiElement.style.transform =

    });

    document.getElementById("emojiButton").addEventListener("click", () => {

        emojis[Math.floor(Math.random() * emojis.length)];

      emojiElement.style.transform =
        `rotate(${Math.floor(Math.random() * 360)}deg)`;
    });
  </script>
